<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cloud Share - Бесплатно</title>
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
        .box { width: 100%; max-width: 500px; background: #161b2c; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .drop-zone { border: 2px dashed #3b82f6; padding: 40px; border-radius: 15px; text-align: center; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .drop-zone:hover { background: rgba(59,130,246,0.1); }
        .btn { background: #3b82f6; border: none; color: white; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #475569; }
        .file-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        a { color: #60a5fa; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>☁️ Облако</h2>
        <form id="upForm">
            <div class="drop-zone" onclick="document.getElementById('fInp').click()">
                Нажми, чтобы выбрать файл
                <input type="file" id="fInp" style="display:none">
            </div>
            <button type="submit" class="btn" id="upBtn">Загрузить</button>
        </form>
        <hr style="margin: 30px 0; opacity: 0.1;">
        <div id="list">Загрузка файлов...</div>
    </div>

    <script>
        const list = document.getElementById('list');
        const form = document.getElementById('upForm');

        async function getFiles() {
            const res = await fetch('/files');
            const data = await res.json();
            list.innerHTML = '<h3>Файлы других:</h3>';
            data.forEach(f => {
                list.innerHTML += `<div class="file-card"><span>${f.name}</span><a href="${f.url}" target="_blank">Скачать</a></div>`;
            });
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('fInp').files[0];
            if(!file) return alert('Выбери файл!');
            
            const btn = document.getElementById('upBtn');
            btn.disabled = true; btn.innerText = 'Загрузка...';

            const fd = new FormData();
            fd.append('file', file);

            await fetch('/upload', { method: 'POST', body: fd });
            btn.disabled = false; btn.innerText = 'Загрузить';
            getFiles();
        };

        getFiles();
    </script>
</body>
</html>
